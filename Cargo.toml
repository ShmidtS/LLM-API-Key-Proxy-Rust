[workspace]
members = ["proxy_app", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["ShmidtS"]
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
bytes = "1"
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "timeout", "limit"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream", "http2"] }
http = "1.3"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dashmap = "6.1"
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
regex = "1.11"
tiktoken-rs = "0.5"
dotenvy = "0.15"
once_cell = "1.21"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
sha2 = "0.10"
ratatui = "0.29"
crossterm = "0.28"
