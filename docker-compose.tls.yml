services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - path: .env
        required: false
    environment:
      RUST_LOG: ${RUST_LOG:-proxy_app=info,tower_http=info}
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - proxy-data:/app/data
    restart: unless-stopped

  tls-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - proxy
    ports:
      - "443:443"
    volumes:
      # Place certificate files at ./certs/fullchain.pem and ./certs/privkey.pem.
      - ./certs:/etc/nginx/certs:ro
    command:
      # Startup command writes a minimal TLS reverse-proxy config and starts nginx.
      - /bin/sh
      - -c
      - |
        cat >/etc/nginx/conf.d/default.conf <<'EOF'
        server {
          listen 443 ssl;
          server_name _;

          ssl_certificate /etc/nginx/certs/fullchain.pem;
          ssl_certificate_key /etc/nginx/certs/privkey.pem;

          location / {
            proxy_pass http://proxy:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
          }
        }
        EOF
        nginx -g 'daemon off;'
    restart: unless-stopped

volumes:
  proxy-data:
