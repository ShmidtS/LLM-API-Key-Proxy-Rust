name: Cleanup Feature Builds

# Trigger automatically when a branch is deleted (typically after PR merge)
# Also allows manual triggering for testing or cleanup of specific branches
on:
  delete:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Branch name to clean up (for manual cleanup)'
        required: true
        type: string
      dry_run:
        description: 'Dry run mode (preview without deleting)'
        required: false
        type: boolean
        default: false

jobs:
  delete-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PROTECTED_BRANCHES: main,master,production,prod,staging,develop
    steps:
      - name: Determine cleanup target
        id: config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH_NAME="${{ inputs.branch_name }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            BRANCH_NAME="${{ github.event.ref }}"
            DRY_RUN="false"
          fi

          BRANCH_NAME="${BRANCH_NAME//\//-}"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT

      - name: Check protected branches
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.config.outputs.branch_name }}
        run: |
          IFS=',' read -ra PROTECTED <<< "$PROTECTED_BRANCHES"
          for branch in "${PROTECTED[@]}"; do
            if [ "$BRANCH_NAME" = "$branch" ]; then
              echo "Branch '$BRANCH_NAME' is protected and will not be cleaned up."
              exit 1
            fi
          done

      - name: Find and process releases
        id: cleanup
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ steps.config.outputs.branch_name }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
        run: |
          PATTERN="$BRANCH_NAME/build-"
          RELEASES=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq ".[] | select(.tagName | startswith(\"$PATTERN\")) | .tagName")
          RELEASE_COUNT=$(printf '%s\n' "$RELEASES" | sed '/^$/d' | wc -l)
          DELETED_COUNT=0
          FAILED_COUNT=0

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              echo "Would delete release and tag: $tag"
              continue
            fi
            if gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes; then
              DELETED_COUNT=$((DELETED_COUNT + 1))
            else
              FAILED_COUNT=$((FAILED_COUNT + 1))
            fi
          done <<< "$RELEASES"

          echo "searched_pattern=$PATTERN" >> $GITHUB_OUTPUT
          echo "release_count=$RELEASE_COUNT" >> $GITHUB_OUTPUT
          echo "deleted_count=$DELETED_COUNT" >> $GITHUB_OUTPUT
          echo "failed_count=$FAILED_COUNT" >> $GITHUB_OUTPUT

      - name: Cleanup summary
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.config.outputs.branch_name }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
          PATTERN: ${{ steps.cleanup.outputs.searched_pattern }}
          RELEASE_COUNT: ${{ steps.cleanup.outputs.release_count }}
          DELETED_COUNT: ${{ steps.cleanup.outputs.deleted_count }}
          FAILED_COUNT: ${{ steps.cleanup.outputs.failed_count }}
        run: |
          echo "Branch: $BRANCH_NAME"
          echo "Search Pattern: ${PATTERN}*"
          echo "Releases Found: $RELEASE_COUNT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Mode: DRY RUN"
          else
            echo "Mode: DELETE"
            echo "Successfully Deleted: $DELETED_COUNT"
            echo "Failed: $FAILED_COUNT"
          fi
