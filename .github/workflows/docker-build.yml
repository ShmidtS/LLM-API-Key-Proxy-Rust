name: Create and publish a Docker image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or commit SHA). Leave empty for default.'
        required: false
        default: ''
  push:
    branches:
      - main
      - dev
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "proxy_app/**"
      - "crates/**"
      - ".github/workflows/docker-build.yml"
      - "Dockerfile"

# Defines two custom environment variables for the workflow. These are used for the Container registry domain, and a name for the Docker image that this workflow builds.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE_STAMP=$(date -u +"%Y%m%d")
          VERSION_TAG="$BRANCH_NAME-$DATE_STAMP-$SHORT_SHA"

          if [ "$BRANCH_NAME" = "main" ]; then
            LATEST_TAG="latest"
          else
            LATEST_TAG="$BRANCH_NAME-latest"
          fi

          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Generated tags:"
          echo "  $LATEST_TAG"
          echo "  $VERSION_TAG"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tags.outputs.latest_tag }}
            type=raw,value=${{ steps.tags.outputs.version_tag }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  cleanup-old-images:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    permissions:
      packages: write
    steps:
      - name: Delete old container images
        uses: actions/delete-package-versions@v5
        with:
          package-name: llm-api-key-proxy-rust
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: false
